<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORDER — UNFORM</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header / Navigation -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">UNFORM</a>
      <nav>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">HOME</a></li>
          <li><a href="product.html">SHOP</a></li>
          <li><a href="order.html" class="active">ORDER</a></li>
          <li><a href="admin.html">ADMIN</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="เปิดเมนู">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="container">
    <div class="order-layout">

      <!-- Preview -->
      <div class="order-preview">
        <figure>
          <img id="orderImage" src="" alt="UNFORM base" />
        </figure>
        <div class="order-preview-meta">
          <p class="product-name" id="orderProductName">UNFORM T-Shirt</p>
          <p class="product-color" id="orderColorLabel">สี: -</p>
          <p class="product-price" id="orderUnitPrice">499 บาท</p>
        </div>
      </div>

      <!-- Form -->
      <div class="order-form">

        <div class="field-group">
          <label>สี</label>
          <div class="swatch-group" id="colorOptions">
            <!-- generated by script.js -->
          </div>
        </div>

        <div class="field-group">
          <label>ไซส์</label>
          <div class="size-group" id="sizeOptions">
            <button type="button" class="size-option" data-size="S">S</button>
            <button type="button" class="size-option" data-size="M">M</button>
            <button type="button" class="size-option" data-size="L">L</button>
            <button type="button" class="size-option" data-size="XL">XL</button>
          </div>
        </div>

        <div class="field-group">
          <label>จำนวน</label>
          <div class="qty-control">
            <button type="button" id="qtyMinus">−</button>
            <input type="number" id="qtyInput" value="1" min="1" />
            <button type="button" id="qtyPlus">+</button>
          </div>
        </div>

        <div class="order-total">
          <span>ยอดรวม</span>
          <span id="orderTotal">499 บาท</span>
        </div>

        <button type="button" class="btn btn-block" id="submitOrderBtn">ยืนยันรายการ DEMO</button>

        <p class="form-message" id="orderMessage"></p>
      </div>

    </div>
  </div>

  <footer class="site-footer">
    <div class="container" style="display:flex; justify-content:space-between; width:100%;">
      <span>UNFORM</span>
      <span>DEMO / MOCKUP — ไม่ใช่หน้าซื้อขายจริง</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
